name: Publish Chrome Extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v prefix
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s
          create_credentials_file: false
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Resolve release version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="$MANUAL_VERSION"
          fi
          echo "value=$release_version" >> "$GITHUB_OUTPUT"
      - run: npm run verify:version -- "${{ steps.version.outputs.value }}"
      - run: npm run pack
      - run: npm run verify:package
      - name: Upload and publish through Chrome Web Store API V2
        env:
          CHROME_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: node scripts/cws-publish.js extension.zip
