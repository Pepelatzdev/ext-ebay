name: Package & Deploy Extension

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Pack extension zip
        run: node scripts/pack.js

      - name: Get Chrome Web Store access token
        id: token
        run: |
          TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.CHROME_CLIENT_ID }}&client_secret=${{ secrets.CHROME_CLIENT_SECRET }}&refresh_token=${{ secrets.CHROME_REFRESH_TOKEN }}&grant_type=refresh_token" \
            | jq -r '.access_token')
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT

      - name: Upload zip to Chrome Web Store
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ steps.token.outputs.value }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/zip" \
            -T extension.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}" \
            | tee /tmp/upload.json | jq .
          jq -e '.uploadState | test("SUCCESS|IN_PROGRESS")' /tmp/upload.json

      - name: Publish on Chrome Web Store
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.value }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}/publish" \
            | jq .

      - name: Prepare landing page
        run: mkdir -p build && cp index.html build/

      - name: Deploy landing page to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
