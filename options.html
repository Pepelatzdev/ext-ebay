<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay Copy Assistant — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">📋</div>
      <div>
        <h1>eBay Copy Assistant</h1>
        <p class="subtitle">Settings</p>
      </div>
    </div>

    <div class="field">
      <label for="preamble">Prompt Preamble</label>
      <textarea id="preamble" rows="4" placeholder="Enter your preamble text..."></textarea>
      <p class="hint">This text will be added before the product data when copying to clipboard.</p>
    </div>

    <div class="field">
      <label for="gemini-url">Gemini Gem URL</label>
      <input type="url" id="gemini-url" placeholder="https://gemini.google.com/gem/cb9c9074ac8d" style="width: 100%;" />
      <p class="hint">The URL of the Gemini Gem that will open when clicking the "Ask Gemini" button.</p>
    </div>

    <div class="actions">
      <button id="save-btn" type="button" class="btn btn-primary">Save</button>
      <button id="reset-btn" type="button" class="btn btn-secondary">Reset to Default</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
  </div>

  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
